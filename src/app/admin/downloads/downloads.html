<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2"><app-sidebar></app-sidebar></div>
        <div class="col ps-5">
            <h1 class="my-5">All Download Recipe List</h1>
            <table class="table table-striped shadow rounded table-hover">
                <thead>
                    <tr class="table-success">
                        <th>#</th>
                        <th>RecipeID</th>
                        <th>Recipe Name</th>
                        <th>Recipe Cuisine</th>
                        <th>Recipe Dowmload Count</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of downloadList(); track $index; let i= $index) {
                        <tr>
                            <td>{{i+1}}</td>
                            <td>{{item.recipeId}}</td>
                            <td>{{item.name}}</td>
                            <td>{{item.cuisine}}</td>
                            <td>{{item.count}}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
