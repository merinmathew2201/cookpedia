<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2"><app-sidebar></app-sidebar></div>
        <div class="col ps-5">
            <h1 class="my-5">All Users List</h1>
            <table class="table table-striped shadow rounded">
                <thead>
                    <tr class="table-success">
                        <th>#</th>
                        <th>User Id</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of userList(); track $index; let i = $index) {
                        <tr>
                            <td>{{i+1}}</td>
                            <td>{{item._id}}</td>
                            <td>{{item.username}}</td>
                            <td>{{item.email}}</td>
                        </tr>
                    }
                    
                </tbody>
            </table>
        </div>
    </div>
</div>
