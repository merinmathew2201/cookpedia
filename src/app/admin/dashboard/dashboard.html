<div class="container-fluid">
    <div class="row">
        @if (sideBarOpen) {
            <div class="col-lg-2"><app-sidebar></app-sidebar></div>
        }
        
        <div class="col">
            <!-- banner -->
             <div class="row">
                 <div class="d-flex bg-success justify-content-between text-light align-items-center p-2">
                    <h3><button (click)="toggleSidebar()" class="btn text-light"><i class="fa-solid fa-bars"></i></button>ADMIN</h3>
                    <div class="dropdown">
                        <button class="btn text-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-user"></i>
                        </button>
                        <ul class="dropdown-menu">
                            <li><button (click)="logout()" class="dropdown-item" >Logout</button></li>
                        </ul>
                        </div>
                 </div>
             </div>

            <!-- box row -->
            <div class="row">
                <div class="col-lg-3">
                    <div class="d-flex p-2 rounded text-light align-items-center justify-content-center mt-4" style="background-color: rgba(197, 165, 25, 0.875);">
                        <i class="fa-solid fa-users fs-1"></i>
                        <div class="ms-5">
                            <h3>Users</h3>
                            <h5>{{userCount()}}</h5>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="d-flex p-2 rounded text-light align-items-center justify-content-center mt-4" style="background-color: rgb(31, 115, 42);">
                        <i class="fa-solid fa-bowl-rice fs-1"></i>
                        <div class="ms-5">
                            <h3>Recipes</h3>
                            <h5>{{recipeCount()}}</h5>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="d-flex p-2 rounded text-light align-items-center justify-content-center mt-4" style="background-color: rgb(35, 45, 232);">
                        <i class="fa-solid fa-download fs-1"></i>
                        <div class="ms-5">
                            <h3>Downloads</h3>
                            <h5>{{downloadCount()}}</h5>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="d-flex p-2 rounded text-light align-items-center justify-content-center mt-4" style="background-color: rgb(216, 24, 168);">
                        <i class="fa-solid fa-message fs-1"></i>
                        <div class="ms-5">
                            <h3>Notifications</h3>
                            <p>You Have <a routerLink="/admin/feedbacks">{{feedbackCount()}}</a> new feedbacks!!!</p>
                        </div>
                    </div>
                </div>

            </div>

            <!--  -->
            <div class="row my-5">
                <div class="col-lg-8">
                    <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'bar'"> </canvas>
                </div>
                <div class="col-lg-4">
                    <!-- calendar -->
                     <mat-card class="demo-inline-calendar-card">
                        <mat-calendar [(selected)]="selected"></mat-calendar>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
</div>
