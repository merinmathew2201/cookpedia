<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2"><app-sidebar></app-sidebar></div>
        <div class="col ps-5">
            <h1 class="my-5">All Recipe List</h1>
            <div class="d-flex justify-content-between my-3">
                <a class="btn btn-primary" routerLink="/admin/recipes/add">Add Recipe</a>
                <input [(ngModel)]="searchKey" type="text" placeholder="Search Recipe Here!" class="form-control w-25">
            </div>
            <table class="table table-striped shadow rounded">
                <thead>
                    <tr class="table-success">
                        <th>#</th>
                        <th>Name</th>
                        <th>Image</th>
                        <th>Cuisine</th>
                        <th>...</th>
                    </tr>
                </thead>
                <tbody>
                    @for (recipe of allRecipe() | search:searchKey; track $index; let i=$index) {
                        <tr>
                            <td>{{i+1}}</td>
                            <td>{{recipe.name}}</td>
                            <td><img width="50px" height="50px" [src]="recipe.image" alt="recipe image"></td>
                            <td>{{recipe.cuisine}}</td>
                            <td><a routerLink="/admin/recipes/{{recipe._id}}"><i class="fa-solid fa-pen-to-square"></i></a>
                            <button class="btn ms-2"><i class="fa-solid fa-trash text-danger"></i></button></td>
                        </tr>
                    }
                    
                </tbody>
            </table>
        </div>
    </div>
</div>
